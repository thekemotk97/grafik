<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161E" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#16202C; --muted:#5B6879; --line:#D6DCE4;
  --off:#E0E5EB; --on:#132030; --focus:#2F5E9E; --swieto:#F2A7C9;
  --rano:#A9C4E8; --popo:#F5B85A; --weekend:#EF7B6E; --dyzur:#B39AEA;
  --trzeci:#9DB2C9; --wolne:#82D1A4; --urlop:#5ECFCB;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161E; --surface:#18212C; --ink:#E5EAF1; --muted:#95A2B3; --line:#2A3542;
    --off:#232D39; --focus:#8DB3EA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161E; --surface:#18212C; --ink:#E5EAF1; --muted:#95A2B3; --line:#2A3542;
  --off:#232D39; --focus:#8DB3EA; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
body.ro .edit-only{display:none!important}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer}
.sw b{display:block;font-size:17px}
.sw input{appearance:none;-webkit-appearance:none;margin:0;width:52px;height:32px;border-radius:16px;background:var(--off);border:1px solid var(--line);position:relative;flex:none;transition:background .15s;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked{background:var(--ink);border-color:var(--ink)}
.sw input:checked::after{transform:translateX(20px)}

.top{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;padding:14px 18px 6px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0}
.who{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
main{max-width:560px;margin:0 auto;padding:6px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* status colours */
.s-rano{--c:var(--rano)} .s-popo{--c:var(--popo)} .s-weekend{--c:var(--weekend)}
.s-dyzur{--c:var(--dyzur)} .s-trzeci{--c:var(--trzeci)} .s-wolne{--c:var(--wolne)}
.s-urlop{--c:var(--urlop)} .s-off{--c:var(--off)} .s-swieto{--c:var(--swieto)} .s-nodata{--c:transparent}

/* hero */
.hero{background:var(--c);color:var(--on);border-radius:22px;padding:18px 20px 20px;margin-top:6px;position:relative;overflow:hidden}
.hero.s-off,.hero.s-nodata{color:var(--ink)}
.hero.s-nodata{border:2px dashed var(--line)}
.hero-date{margin:0;font-size:15px;font-weight:500;opacity:.8}
.hero-word{margin:2px 0 0;font-size:clamp(52px,17vw,88px);line-height:.95;font-weight:800;letter-spacing:-.035em;word-break:break-word}
.hero-desc{margin:6px 0 0;font-size:17px;font-weight:600}
.hero-next{margin:16px 0 0;padding-top:12px;border-top:1px solid color-mix(in srgb,currentColor 22%,transparent);font-size:15px;display:flex;justify-content:space-between;gap:12px}
.hero-next b{font-weight:700}

/* tape */
.tape-wrap{margin:22px -16px 0;overflow-x:auto;scrollbar-width:none}
.tape-wrap::-webkit-scrollbar{display:none}
.tape{display:flex;gap:4px;padding:0 16px;width:max-content}
.tape-day{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;width:40px}
.tape-wd{font-size:12px;color:var(--muted);font-weight:500}
.tape-wd.we{color:var(--ink);font-weight:700}
.tape-block{width:40px;height:52px;border-radius:10px;background:var(--c);color:var(--on);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;line-height:1.1}
.tape-block small{font-size:11px;font-weight:700;opacity:.75}
.tape-day.s-off .tape-block{color:var(--muted)}
.tape-block{position:relative}
.tape-day.hol .tape-block::before,.cal-day.hol::before{content:"★";position:absolute;top:3px;left:5px;font-size:10px;line-height:1;font-weight:700}
.tape-day.s-nodata .tape-block{border:1.5px dashed var(--line);color:var(--muted)}
.tape-day.today .tape-block{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.tape-month{font-size:12px;color:var(--muted);align-self:flex-end;writing-mode:vertical-rl;transform:rotate(180deg);padding:0 2px 6px;font-weight:600}

h3.sec{font-size:15px;font-weight:700;margin:28px 2px 8px;color:var(--muted)}

/* upcoming list */
.list{background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;padding:14px 16px 14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .bar{align-self:stretch;background:var(--c);border-radius:0 4px 4px 0}
.row.s-off .bar{background:var(--muted);opacity:.35}
.row-title{font-size:14px;color:var(--muted);font-weight:500}
.row-main{font-size:18px;font-weight:700;letter-spacing:-.01em}
.row-sub{font-size:14px;color:var(--muted);margin-top:2px}
.row-rel{font-size:14px;font-weight:700;text-align:right;white-space:nowrap}
.row-rel.now{background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 10px}
.row-empty{color:var(--muted);font-size:15px}

.note{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:15px;display:flex;gap:12px;align-items:center;justify-content:space-between}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;border:1px solid var(--weekend);color:var(--ink)}
.btn.danger-fill{background:var(--weekend);color:var(--on)}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.cal-head h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.cal-head h2 span{color:var(--muted);font-weight:500}
.cal-nav{display:flex;gap:6px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal-wd.we{color:var(--ink)}
.cal-day{aspect-ratio:1/1.12;border:0;border-radius:10px;background:var(--c);color:var(--on);padding:4px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;min-width:0}
.cal-day .n{font-size:16px;font-weight:700;line-height:1.2}
.cal-day .t{font-size:11px;font-weight:700;opacity:.8;margin-top:auto;margin-bottom:5px}
.cal-day.s-off{color:var(--muted)}
.cal-day.s-nodata{border:1.5px dashed var(--line);color:var(--muted)}
.cal-day.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.cal-day.edited::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:16px 2px 0;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--c);display:inline-block}
.legend .s-off i{border:1px solid var(--line)}
.legend .edited-dot i{background:none;width:auto;height:auto}
.legend .star i{background:none;width:auto;height:auto;font-style:normal;font-size:12px;color:var(--ink)}
.legend .edited-dot i::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.stat b{font-size:18px}
.stat i{width:10px;height:10px;border-radius:3px;background:var(--c)}

.team{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.team-row{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.team-row:first-child{border-top:0}
.team-row.we{background:color-mix(in srgb,var(--off) 55%,transparent)}
.team-row.is-today{box-shadow:inset 3px 0 0 var(--ink)}
.team-date{font-weight:700;font-size:15px;line-height:1.25}
.team-date small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.team-names{font-size:14px;line-height:1.5;color:var(--muted)}
.team-names b{color:var(--ink);font-weight:600}
.team-names mark{background:var(--c,var(--popo));color:var(--on);border-radius:5px;padding:0 4px;font-weight:700}
.team-names .empty{font-style:italic}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 6px}
label.f:first-child{margin-top:0}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
textarea.inp{min-height:180px;font-size:14px;line-height:1.4;resize:vertical;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:15px}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.preview{margin-top:12px;font-size:15px}
.preview.ok{color:var(--ink)}
.preview .bad{color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ink)}

.vac{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;padding:12px 14px 12px 0;border-top:1px solid var(--line)}
.vac:first-child{border-top:0}
.vac .bar{align-self:stretch;background:var(--urlop);border-radius:0 4px 4px 0}
.vac.past{opacity:.55}

/* urlop: pula */
.pool-num{font-size:60px;font-weight:800;letter-spacing:-.035em;line-height:1}
.pool-txt{font-size:17px;font-weight:600;margin-top:4px}
.meter{height:10px;border-radius:5px;background:var(--off);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;background:var(--urlop);border-radius:5px}
.meter.over i{background:var(--weekend)}
.pool-row{display:flex;gap:10px}
.pool-row .inp{flex:1}
/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.015em}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:8px;background:var(--c);color:var(--on);padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px}
.pill.s-off,.pill.s-nodata{color:var(--ink);border:1px solid var(--line)}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;max-width:560px;margin:0 auto}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 8px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}
.tabs button.on .ic{background:var(--off);border-radius:999px}
.tabs .ic{padding:3px 16px;display:grid;place-items:center}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.welcome h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px;line-height:1.1}
.welcome p{color:var(--muted);margin:0 0 6px}
</style>
</head>
<body>
<header class="top">
  <h1>Grafik</h1>
  <button class="who" id="whoBtn" type="button"></button>
</header>

<main>
  <section id="tab-start" class="tab"></section>
  <section id="tab-grafik" class="tab" hidden></section>
  <section id="tab-urlop" class="tab" hidden></section>
  <section id="tab-import" class="tab" hidden></section>
  <section id="tab-ust" class="tab" hidden></section>
</main>

<nav class="tabs" aria-label="Zakładki">
  <div class="tabs-in">
    <button type="button" data-tab="start" class="on"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Start</button>
    <button type="button" data-tab="grafik"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Grafik</button>
    <button type="button" data-tab="urlop"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Urlop</button>
    <button type="button" data-tab="import" class="edit-only"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/></svg></span>Wklej</button>
    <button type="button" data-tab="ust"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Ustawienia</button>
  </div>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const SEED = "";

// LOGIC-START
const MONTHS_GEN=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MONTHS_SHORT=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const MONTHS_NOM=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const MONTHS_LOC=['styczniu','lutym','marcu','kwietniu','maju','czerwcu','lipcu','sierpniu','wrześniu','październiku','listopadzie','grudniu'];
const WD_SHORT=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];
const WD_FULL=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const WD_MIN=['Nd','Pn','Wt','Śr','Cz','Pt','So'];
const MONTH_MAP={sty:1,lut:2,mar:3,kwi:4,maj:5,cze:6,lip:7,sie:8,wrz:9,'paź':10,paz:10,lis:11,gru:12};

const STATUS={
  rano:{label:'Rano',hero:'Rano',desc:'zwykła zmiana poranna',short:'R'},
  popo:{label:'Popołudnie',hero:'Popołudnie',desc:'zmiana popołudniowa',short:'P'},
  weekend:{label:'Weekend w pracy',hero:'Weekend',desc:'zmiana weekendowa',short:'W'},
  dyzur:{label:'Dyżur telefoniczny',hero:'Dyżur',desc:'dyżur telefoniczny',short:'D'},
  trzeci:{label:'Trzeci człowiek',hero:'Trzeci',desc:'trzeci człowiek',short:'3'},
  wolne:{label:'Wolne',hero:'Wolne',desc:'odbiór za weekend',short:'Wo'},
  urlop:{label:'Urlop',hero:'Urlop',desc:'miłego odpoczynku',short:'U'},
  off:{label:'Wolny weekend',hero:'Wolne',desc:'wolny weekend',short:''},
  swieto:{label:'Wolne (święto)',hero:'Wolne',desc:'',short:'Ś'},
  nodata:{label:'Brak grafiku',hero:'Brak grafiku',desc:'wklej grafik na te dni',short:'?'}
};
const OVERRIDES=['rano','popo','weekend','dyzur','trzeci','wolne','urlop'];

const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const todayDate=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const diffDays=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
const isWeekend=d=>d.getDay()===0||d.getDay()===6;

const holCache={};
function holidays(y){
  if(holCache[y]) return holCache[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  const easter=new Date(y,month-1,day);
  const map={};
  const fix=(mm,dd,n)=>{map[y+'-'+pad(mm)+'-'+pad(dd)]=n;};
  fix(1,1,'Nowy Rok'); fix(1,6,'Trzech Króli');
  map[key(easter)]='Wielkanoc'; map[key(addDays(easter,1))]='Poniedziałek Wielkanocny';
  fix(5,1,'Święto Pracy'); fix(5,3,'Święto Konstytucji 3 Maja');
  map[key(addDays(easter,49))]='Zielone Świątki'; map[key(addDays(easter,60))]='Boże Ciało';
  fix(8,15,'Wniebowzięcie NMP'); fix(11,1,'Wszystkich Świętych'); fix(11,11,'Święto Niepodległości');
  if(y>=2025) fix(12,24,'Wigilia');
  fix(12,25,'Boże Narodzenie'); fix(12,26,'Drugi dzień świąt');
  return holCache[y]=map;
}
const holidayName=k=>holidays(Number(k.slice(0,4)))[k]||'';

function norm(s){
  return String(s||'').replace(/\(.*?\)/g,'').trim().toLowerCase()
    .replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function cellHas(cell,n){
  if(!cell||!n) return false;
  return String(cell).split(/[\/,;+&]|\s+i\s+/).some(p=>norm(p)===n);
}

/* ---------- parsing ---------- */
function parseDate(s){
  s=String(s||'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return mk(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[-.\s\/]+([a-ząćęłńóśźż]{3,}|\d{1,2})[-.\s\/]+(\d{2,4})/i);
  if(!m) return null;
  let mon;
  if(/^\d+$/.test(m[2])) mon=+m[2];
  else{ const p=m[2].toLowerCase().slice(0,3); mon=MONTH_MAP[p]||MONTH_MAP[norm(p)]; }
  let y=+m[3]; if(y<100) y+=2000;
  return mk(y,mon,+m[1]);
  function mk(y,mo,d){
    if(!mo||mo<1||mo>12||d<1||d>31) return null;
    const dt=new Date(y,mo-1,d);
    if(dt.getMonth()!==mo-1) return null;
    return dt;
  }
}
const WD_RE=/^(pon|pn|wt|śr|sr|czw|cz|pt|sob|so|niedz|nd|nie)\.?$/i;

function parseSchedule(text){
  const rows={}; let bad=0;
  String(text||'').split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    let cells;
    const hasTab=line.indexOf('\t')>=0;
    if(hasTab) cells=line.split('\t');
    else if(line.indexOf(';')>=0) cells=line.split(';');
    else cells=null;
    let d, names;
    if(cells){
      d=parseDate(cells[0]);
      if(!d){ if(/\d/.test(cells[0])) bad++; return; }
      let rest=cells.slice(1);
      if(rest.length && WD_RE.test(rest[0].trim())) rest=rest.slice(1);
      names=[0,1,2,3].map(i=>(rest[i]||'').trim());
    } else {
      // brak tabulatorów: data, dzień tygodnia, potem imiona oddzielone spacjami
      d=parseDate(line);
      if(!d){ if(/\d/.test(line)) bad++; return; }
      const toks=line.trim().split(/\s+/);
      let i=1;
      if(toks[i] && WD_RE.test(toks[i])) i++;
      const n=toks.slice(i);
      names=['','','',''];
      if(isWeekend(d)){ names[0]=n[0]||''; names[3]=n[1]||''; }
      else { names[0]=n[0]||''; names[1]=n[1]||''; names[2]=n[2]||''; }
    }
    rows[key(d)]=names;
  });
  const keys=Object.keys(rows).sort();
  return {rows,count:keys.length,from:keys[0]||null,to:keys[keys.length-1]||null,bad};
}

/* ---------- state ---------- */
function emptyState(){return {v:1,updatedAt:0,name:'',theme:'auto',rows:{},overrides:{},vacations:[],allowance:{}};}
function sanitize(s){
  if(!s||typeof s!=='object') return null;
  const o=emptyState();
  o.updatedAt=+s.updatedAt||0;
  o.name=typeof s.name==='string'?s.name:'';
  o.theme=['auto','light','dark'].includes(s.theme)?s.theme:'auto';
  o.rowsClearedAt=+s.rowsClearedAt||0;
  if(s.rows&&typeof s.rows==='object') for(const k in s.rows){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(s.rows[k])) o.rows[k]=[0,1,2,3].map(i=>String(s.rows[k][i]||'')); }
  if(s.overrides&&typeof s.overrides==='object') for(const k in s.overrides){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&OVERRIDES.includes(s.overrides[k])) o.overrides[k]=s.overrides[k]; }
  if(s.allowance&&typeof s.allowance==='object') for(const y in s.allowance){ const v=Math.round(+s.allowance[y]); if(/^\d{4}$/.test(y)&&v>=0&&v<1000) o.allowance[y]=v; }
  if(Array.isArray(s.vacations)) o.vacations=s.vacations.filter(v=>v&&/^\d{4}-\d{2}-\d{2}$/.test(v.from)&&/^\d{4}-\d{2}-\d{2}$/.test(v.to)).map(v=>({id:String(v.id||Math.random().toString(36).slice(2)),from:v.from,to:v.to,note:String(v.note||'')}));
  return o;
}

let state=emptyState();
let range={min:null,max:null};
const memo=new Map(), compMemo=new Map();
function recomputeRange(){
  memo.clear(); compMemo.clear();
  const ks=Object.keys(state.rows).sort();
  range={min:ks[0]||null,max:ks[ks.length-1]||null};
}
const covered=k=>range.min&&k>=range.min&&k<=range.max;
const inVacation=k=>state.vacations.some(v=>k>=v.from&&k<=v.to);

function assignmentFor(row,k,name){
  if(!row) return undefined;
  const n=norm(name); if(!n) return null;
  const m=i=>cellHas(row[i],n);
  if(isWeekend(fromKey(k))){
    if(m(0)||m(1)||m(2)) return 'weekend';
    if(m(3)) return 'dyzur';
  } else {
    // święto w dzień roboczy: kto jest wpisany, ten ma zmianę poranną, reszta wolne
    if(holidayName(k)) return (m(0)||m(1)||m(2)||m(3))?'rano':null;
    if(m(0)||m(1)) return 'popo';
    if(m(2)) return 'trzeci';
    if(m(3)) return 'dyzur';
  }
  return null;
}
const assignment=k=>assignmentFor(state.rows[k],k,state.name);
const baseWork=k=>state.overrides[k]||assignment(k);

const WORK=['rano','popo','weekend','dyzur','trzeci'];
const weekendWorked=satK=>baseWork(satK)==='weekend'||baseWork(key(addDays(fromKey(satK),1)))==='weekend';
// 3 dni wolne za pracujący weekend: kolejne dni robocze po weekendzie, pomijając święta
// (w święto i tak jest wolne, więc dzień wolny przechodzi dalej) i dni, w które ktoś cię wpisał
function compDays(satK){
  if(compMemo.has(satK)) return compMemo.get(satK);
  const res=[]; let d=addDays(fromKey(satK),2);
  for(let i=0;i<21&&res.length<3;i++,d=addDays(d,1)){
    const k=key(d);
    if(isWeekend(d)||holidayName(k)) continue;
    const o=state.overrides[k];
    if(o&&WORK.includes(o)) continue;
    if(!o&&assignment(k)) continue;
    res.push(k);
  }
  compMemo.set(satK,res); return res;
}
function isComp(k){
  const dt=fromKey(k);
  for(let j=2;j<=22;j++){
    const s=addDays(dt,-j);
    if(s.getDay()!==6) continue;
    const sk=key(s);
    if(weekendWorked(sk)&&compDays(sk).includes(k)) return true;
  }
  return false;
}
// flagi: 'o' = bez ręcznej zmiany tego dnia, 'v' = bez urlopu
function status(k,f){
  f=f||'';
  const mk=k+'|'+f;
  if(memo.has(mk)) return memo.get(mk);
  const r=statusRaw(k,f); memo.set(mk,r); return r;
}
function statusRaw(k,f){
  const o=f.indexOf('o')>=0?null:state.overrides[k];
  const nv=f.indexOf('v')>=0;
  if(o&&!(nv&&o==='urlop')) return o;
  if(!nv&&inVacation(k)) return 'urlop';
  const a=assignment(k); if(a) return a;
  const dt=fromKey(k), we=isWeekend(dt);
  if(!we&&isComp(k)) return 'wolne';
  if(!we&&holidayName(k)) return 'swieto';
  if(!state.rows[k]&&!covered(k)) return 'nodata';
  if(we) return 'off';
  return 'rano';
}
const autoStatus=k=>status(k,'o');
// czy ten dzień zabiera dzień z puli urlopu (normalnie byłby dniem pracy)
const wouldWork=k=>!isWeekend(fromKey(k))&&['rano','popo','trzeci','dyzur','nodata'].includes(status(k,'v'));
function vacCostIn(a,b){ let n=0; for(let d=fromKey(a);key(d)<=b;d=addDays(d,1)){ const k=key(d); if(status(k)==='urlop'&&wouldWork(k)) n++; } return n; }
function usedInYear(y){ return vacCostIn(y+'-01-01',y+'-12-31'); }
function newVacCost(a,b){ let n=0; for(let d=fromKey(a);key(d)<=b;d=addDays(d,1)){ const k=key(d); if(status(k)!=='urlop'&&!state.overrides[k]&&wouldWork(k)) n++; } return n; }
function fmtList(keys){
  if(!keys.length) return '';
  const groups=[]; let g=[keys[0],keys[0]];
  for(let i=1;i<keys.length;i++){ if(diffDays(fromKey(g[1]),fromKey(keys[i]))===1) g[1]=keys[i]; else { groups.push(g); g=[keys[i],keys[i]]; } }
  groups.push(g);
  const parts=groups.map(x=>x[0]===x[1]?fmtDay(x[0],false):fmtRange(x[0],x[1]));
  return parts.length===2?parts.join(' i '):parts.join(', ');
}

function blocksFrom(start,days){
  const out=[]; let cur=null;
  for(let i=0;i<days;i++){
    const d=addDays(start,i), k=key(d), s=status(k);
    if(cur&&cur.s===s&&diffDays(fromKey(cur.end),d)===1){cur.end=k;}
    else {cur={s,start:k,end:k}; out.push(cur);}
  }
  return out;
}

function fmtDay(k,withWd){
  const d=fromKey(k);
  return (withWd?WD_SHORT[d.getDay()]+' ':'')+d.getDate()+' '+MONTHS_SHORT[d.getMonth()]+(d.getFullYear()!==todayDate().getFullYear()?' '+d.getFullYear():'');
}
function fmtRange(a,b){
  if(a===b) return fmtDay(a,true);
  const da=fromKey(a), db=fromKey(b);
  const yr=db.getFullYear()!==todayDate().getFullYear()?' '+db.getFullYear():'';
  if(da.getMonth()===db.getMonth()&&da.getFullYear()===db.getFullYear()) return da.getDate()+'–'+db.getDate()+' '+MONTHS_SHORT[db.getMonth()]+yr;
  return da.getDate()+' '+MONTHS_SHORT[da.getMonth()]+(da.getFullYear()!==db.getFullYear()?' '+da.getFullYear():'')+' – '+db.getDate()+' '+MONTHS_SHORT[db.getMonth()]+yr;
}
function wdRange(a,b){
  const da=fromKey(a), db=fromKey(b);
  return a===b?WD_FULL[da.getDay()]:WD_SHORT[da.getDay()].replace('.','')+'–'+WD_SHORT[db.getDay()];
}
function rel(a,b){
  const t=todayDate(), da=fromKey(a), db=fromKey(b);
  if(diffDays(da,t)>=0&&diffDays(t,db)>=0) return a===b?{t:'dziś',now:true}:{t:'trwa',now:true};
  const n=diffDays(t,da);
  if(n===1) return {t:'jutro'};
  return {t:'za '+n+' dni'};
}
function workdaysIn(a,b){
  let n=0; for(let d=fromKey(a);key(d)<=b;d=addDays(d,1)){ if(!isWeekend(d)&&!holidayName(key(d))) n++; }
  return n;
}
const plDni=n=>n===1?'1 dzień':n+' dni';

/* ---------- storage ---------- */
let LS_KEY='grafik.v1';
let READONLY=false;
// tryb tylko do odczytu ustawiany na tym urządzeniu (nie synchronizuje się)
let LOCKED=false; try{ LOCKED=localStorage.getItem('grafik.lock')==='1'; }catch(e){}
function applyLock(){ document.body.classList.toggle('ro',READONLY||LOCKED); }
function loadLocal(){ try{ const r=localStorage.getItem(LS_KEY); return r?sanitize(JSON.parse(r)):null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} }
function coverageText(){
  const ms=[...new Set(Object.keys(state.rows).map(k=>k.slice(0,7)))].sort();
  if(!ms.length) return '';
  const byY={}; ms.forEach(m=>{ const y=m.slice(0,4); (byY[y]=byY[y]||[]).push(MONTHS_NOM[+m.slice(5)-1].toLowerCase()); });
  return Object.keys(byY).map(y=>byY[y].join(', ')+' '+y).join('; ');
}
const UNDO_KEY='grafik.undo';
function snapshot(label){ try{ localStorage.setItem(UNDO_KEY,JSON.stringify({at:Date.now(),label,state})); }catch(e){} }
function readUndo(){ try{ const u=JSON.parse(localStorage.getItem(UNDO_KEY)||'null'); return u&&u.state?u:null; }catch(e){ return null; } }
function commit(){ state.updatedAt=Date.now(); recomputeRange(); saveLocal(); schedulePush(); if(window.__onCommit) try{ window.__onCommit(); }catch(e){} }

let remote=null, remoteBusy=false, remoteDirty=false, pushTimer=null, syncState='local';
function schedulePush(){ if(!remote) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushRemote,1000); }
async function pushRemote(){
  if(!remote) return;
  if(remoteBusy){remoteDirty=true;return;}
  remoteBusy=true;
  try{ await remote.set({updatedAt:state.updatedAt,json:JSON.stringify(state)}); syncState='sync'; }
  catch(e){ if(e&&e.code==='invalid_argument'){ remote=null; syncState='local'; } else syncState='error'; }
  remoteBusy=false;
  if(remoteDirty){remoteDirty=false;pushRemote();}
  if(currentTab==='ust') renderSettings();
}
// scala dwa zapisy: nowszy wygrywa przy tych samych datach, brakujące dni grafiku i urlopy są dopisywane
function mergeStates(a,b){
  const m=sanitize(JSON.parse(JSON.stringify(a)));
  if(!(m.rowsClearedAt>b.updatedAt)) for(const k in b.rows) if(!m.rows[k]) m.rows[k]=b.rows[k].slice();
  for(const y in b.allowance) if(!(y in m.allowance)) m.allowance[y]=b.allowance[y];
  if(!(m.rowsClearedAt>b.updatedAt)) for(const k in b.overrides) if(!(k in m.overrides)) m.overrides[k]=b.overrides[k];
  b.vacations.forEach(v=>{ if(!m.vacations.some(x=>x.id===v.id||(x.from===v.from&&x.to===v.to))) m.vacations.push(Object.assign({},v)); });
  if(!m.name) m.name=b.name;
  m.updatedAt=Math.max(a.updatedAt,b.updatedAt);
  return m;
}
async function initRemote(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.collection('data/users/'+id).doc('grafik');
    const snap=await ref.get();
    remote=ref; syncState='sync';
    if(snap.exists){
      const d=snap.data()||{};
      let rs=null; try{ rs=typeof d.json==='string'?sanitize(JSON.parse(d.json)):null; }catch(e){}
      if(rs){
        let merged;
        if(!state.updatedAt) merged=rs;   // świeże otwarcie bez własnych zmian: bierz zapis z konta
        else merged=rs.updatedAt>state.updatedAt?mergeStates(rs,state):mergeStates(state,rs);
        const changedVsRemote=JSON.stringify(merged)!==JSON.stringify(rs);
        if(changedVsRemote) merged.updatedAt=Date.now();
        state=merged; recomputeRange(); saveLocal(); applyTheme(); renderAll();
        if(changedVsRemote) pushRemote();
        return;
      } else if(state.updatedAt>0) pushRemote();
    } else if(state.updatedAt>0) pushRemote();
    if(currentTab==='ust') renderSettings();
  }catch(e){ remote=null; syncState='local'; }
}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
function applyTheme(){ const r=document.documentElement; if(state.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',state.theme); }
function knownNames(){
  const set=new Map();
  Object.values(state.rows).forEach(r=>r.forEach(c=>String(c).split(/[\/,;+&]/).forEach(p=>{ const t=p.trim(); if(t&&t.length<30&&!/\d/.test(t)&&!set.has(norm(t))) set.set(norm(t),t); })));
  return [...set.values()].sort((a,b)=>a.localeCompare(b,'pl'));
}

/* ---------- START ---------- */
function renderStart(){
  const el=$('#tab-start');
  if(!state.name&&READONLY){ el.innerHTML='<div class="card welcome"><h2>Wczytuję grafik…</h2><p>Potrzebny jest internet przy pierwszym otwarciu. Potem grafik będzie dostępny także offline.</p></div>'; return; }
  if(!state.name){ el.innerHTML=welcomeHtml(); bindWelcome(el); return; }
  const t=todayDate(), tk=key(t), st=status(tk);
  const tmK=key(addDays(t,1)), tm=status(tmK);
  const S=STATUS[st];
  let desc=S.desc;
  if(st==='swieto') desc=holidayName(tk);
  if(st==='rano'&&!state.overrides[tk]&&holidayName(tk)&&!isWeekend(t)) desc='praca w święto ('+holidayName(tk)+'), reszta ma wolne';
  else if(st==='rano'&&!state.overrides[tk]&&state.rows[tk]&&!state.rows[tk].some(Boolean)&&!isWeekend(t)) desc='tylko zmiana poranna, nikt nie wpisany';
  if(st==='wolne'&&!state.overrides[tk]) desc='odbiór za pracujący weekend';
  if(st==='wolne'&&state.overrides[tk]) desc='wpisane ręcznie';
  let h='';
  h+='<div class="hero s-'+st+'"><p class="hero-date">Dziś, '+WD_FULL[t.getDay()]+' '+t.getDate()+' '+MONTHS_GEN[t.getMonth()]+'</p>';
  h+='<h2 class="hero-word">'+esc(S.hero)+'</h2>';
  if(desc) h+='<p class="hero-desc">'+esc(desc)+'</p>';
  h+='<p class="hero-next"><span>Jutro, '+WD_FULL[fromKey(tmK).getDay()]+'</span><b>'+esc(tm==='swieto'?'Wolne, '+holidayName(tmK):STATUS[tm].label)+'</b></p></div>';

  // taśma
  h+='<div class="tape-wrap"><div class="tape">';
  for(let i=0;i<28;i++){
    const d=addDays(t,i), k=key(d), s=status(k);
    if(i>0&&d.getDate()===1) h+='<span class="tape-month">'+MONTHS_SHORT[d.getMonth()]+'</span>';
    h+='<button type="button" class="tape-day s-'+s+(i===0?' today':'')+(holidayName(k)?' hol':'')+'" data-day="'+k+'" aria-label="'+esc(WD_FULL[d.getDay()]+' '+d.getDate()+' '+MONTHS_GEN[d.getMonth()]+': '+STATUS[s].label)+'">'+
      '<span class="tape-wd'+(isWeekend(d)?' we':'')+'">'+WD_MIN[d.getDay()]+'</span>'+
      '<span class="tape-block">'+d.getDate()+'<small>'+esc(STATUS[s].short)+'</small></span></button>';
  }
  h+='</div></div>';

  // najbliższe
  const bl=blocksFrom(t,240);
  const next=s=>bl.find(b=>b.s===s);
  const rows=[];
  const wk=next('weekend');
  if(wk){
    const ws=fromKey(wk.start), satK=key(ws.getDay()===0?addDays(ws,-1):ws);
    const comp=compDays(satK);
    const sub=comp.length?'potem wolne '+fmtList(comp):'';
    rows.push(rowHtml('weekend','Najbliższy weekend w pracy',wk,sub));
  } else rows.push(emptyRow('weekend','Najbliższy weekend w pracy','Brak w grafiku'));
  // najbliższe wolne: ciąg wolnych dni (po weekendzie, święta, urlop, przyległy wolny weekend), z co najmniej jednym dniem poza zwykłym weekendem
  const FREE=['wolne','swieto','urlop','off'];
  let fb=null;
  for(let i=0;i<bl.length&&!fb;i++){
    if(!FREE.includes(bl[i].s)) continue;
    let j=i; while(j+1<bl.length&&FREE.includes(bl[j+1].s)) j++;
    const grp=bl.slice(i,j+1);
    if(grp.some(b=>b.s!=='off')) fb={start:grp[0].start,end:grp[grp.length-1].end,grp};
    i=j;
  }
  if(fb){
    const why=[];
    fb.grp.forEach(b=>{ const w=b.s==='wolne'?'po weekendzie':b.s==='swieto'?(b.start===b.end?holidayName(b.start):'święta'):b.s==='urlop'?'urlop':'weekend'; if(!why.includes(w)) why.push(w); });
    rows.push(rowHtml('wolne','Najbliższe wolne',fb,plDni(diffDays(fromKey(fb.start),fromKey(fb.end))+1)+': '+why.join(', ')));
  } else rows.push(emptyRow('wolne','Najbliższe wolne','Brak w grafiku'));
  const po=next('popo');
  rows.push(po?rowHtml('popo','Najbliższe popołudniówki',po,plDni(diffDays(fromKey(po.start),fromKey(po.end))+1)):emptyRow('popo','Najbliższe popołudniówki','Brak w grafiku'));
  const dy=next('dyzur');
  rows.push(dy?rowHtml('dyzur','Najbliższy dyżur telefoniczny',dy,''):emptyRow('dyzur','Najbliższy dyżur telefoniczny','Brak w grafiku'));
  const tr=next('trzeci');
  if(tr) rows.push(rowHtml('trzeci','Trzeci człowiek',tr,''));
  // święta
  let nh=null, nfh=null;
  for(let i=0;i<400&&!nfh;i++){
    const k=key(addDays(t,i)), hn=holidayName(k);
    if(!hn) continue;
    if(!nh) nh=k;
    if(status(k)==='swieto') nfh=k;
  }
  const holSub=k=>{ const s=status(k), hn=holidayName(k);
    return hn+', '+(s==='swieto'?'masz wolne':s==='off'?'wypada w weekend':s==='urlop'?'masz urlop':s==='wolne'?'masz wolne':WORK.includes(s)?(s==='rano'?'jesteś wpisany, zmiana poranna':'pracujesz: '+STATUS[s].label.toLowerCase()):STATUS[s].label.toLowerCase()); };
  if(nh) rows.push(rowHtml('swieto','Najbliższe święto',{start:nh,end:nh},holSub(nh)));
  if(nfh&&nfh!==nh) rows.push(rowHtml('swieto','Najbliższe wolne w święto',{start:nfh,end:nfh},holSub(nfh)));
  const yNow=t.getFullYear(), pool=state.allowance[yNow];
  const leftTxt=pool!=null?'zostało '+plDni(pool-usedInYear(yNow))+' w '+yNow:'';
  const ur=next('urlop');
  rows.push(ur?rowHtml('urlop','Najbliższy urlop',ur,plDni(vacCostIn(ur.start,ur.end))+' z puli'+(leftTxt?', '+leftTxt:'')):
    '<div class="row s-urlop"><span class="bar"></span><div><div class="row-title">Urlop</div><div class="row-empty">Nie masz zaplanowanego urlopu'+(leftTxt?', '+esc(leftTxt):'')+'</div></div><button type="button" class="btn small ghost edit-only" data-go="urlop">Dodaj</button></div>');
  const ff=bl.find(b=>b.s==='off');
  if(ff) rows.push(rowHtml('off','Najbliższy wolny weekend',ff,''));
  const by=s=>rows.filter(x=>x.startsWith('<div class="row s-'+s+'"'));
  const work=[...by('popo'),...by('weekend'),...by('dyzur'),...by('trzeci')];
  const free=[...by('off'),...by('wolne'),...by('swieto'),...by('urlop')];
  h+='<h3 class="sec">Praca</h3><div class="list">'+work.join('')+'</div>';
  h+='<h3 class="sec">Wolne</h3><div class="list">'+free.join('')+'</div>';

  if(!range.max){
    h+='<div class="note edit-only"><span>Nie masz jeszcze wpisanego grafiku.</span><button type="button" class="btn small" data-go="import">Wklej grafik</button></div>';
  } else {
    const left=diffDays(t,fromKey(range.max));
    if(left<21) h+='<div class="note edit-only"><span>'+(left<0?'Grafik skończył się ':'Grafik masz wpisany do ')+fmtDay(range.max,false)+'. Wklej kolejne tygodnie.</span><button type="button" class="btn small" data-go="import">Wklej</button></div>';
  }
  el.innerHTML=h;
}
function rowHtml(s,title,b,sub){
  const r=rel(b.start,b.end);
  return '<div class="row s-'+s+'"><span class="bar"></span><div><div class="row-title">'+esc(title)+'</div>'+
    '<div class="row-main">'+esc(fmtRange(b.start,b.end))+'</div>'+
    '<div class="row-sub">'+esc(b.start===b.end?sub:wdRange(b.start,b.end)+(sub?', '+sub:''))+'</div></div>'+
    '<div class="row-rel'+(r.now?' now':'')+'">'+esc(r.t)+'</div></div>';
}
function emptyRow(s,title,txt){
  return '<div class="row s-'+s+'"><span class="bar"></span><div><div class="row-title">'+esc(title)+'</div><div class="row-empty">'+esc(txt)+'</div></div><span></span></div>';
}

/* ---------- GRAFIK ---------- */
function renderGrafik(){
  const el=$('#tab-grafik');
  const {y,m}=viewMonth;
  const first=new Date(y,m,1), daysIn=new Date(y,m+1,0).getDate(), off=(first.getDay()+6)%7;
  const tk=key(todayDate());
  let h='<div class="cal-head"><h2>'+MONTHS_NOM[m]+' <span>'+y+'</span></h2><div class="cal-nav">'+
    '<button type="button" class="icon-btn" id="mPrev" aria-label="Poprzedni miesiąc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>'+
    '<button type="button" class="icon-btn" id="mNext" aria-label="Następny miesiąc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div></div>';
  h+='<div class="cal">';
  ['Pn','Wt','Śr','Cz','Pt','So','Nd'].forEach((w,i)=>h+='<div class="cal-wd'+(i>4?' we':'')+'">'+w+'</div>');
  for(let i=0;i<off;i++) h+='<div></div>';
  const cnt={};
  for(let d=1;d<=daysIn;d++){
    const dt=new Date(y,m,d), k=key(dt), s=status(k);
    cnt[s]=(cnt[s]||0)+1;
    h+='<button type="button" class="cal-day s-'+s+(k===tk?' today':'')+(state.overrides[k]?' edited':'')+(holidayName(k)?' hol':'')+'" data-day="'+k+'" aria-label="'+esc(d+' '+MONTHS_GEN[m]+': '+STATUS[s].label)+'"><span class="n">'+d+'</span><span class="t">'+esc(STATUS[s].short)+'</span></button>';
  }
  h+='</div>';
  h+='<div class="legend">'+['rano','popo','weekend','dyzur','wolne','swieto','urlop','off'].map(s=>'<span class="s-'+s+'"><i></i>'+STATUS[s].label+'</span>').join('')+'<span class="star"><i>★</i>dzień świąteczny</span><span class="edited-dot"><i></i>zmienione ręcznie</span></div>';

  const st=[['popo','popołudniówki'],['weekend','dni weekendowe'],['dyzur','dni dyżuru'],['wolne','dni wolne za weekend'],['swieto','wolne w święta'],['urlop','dni urlopu']].filter(x=>cnt[x[0]]);
  if(st.length) h+='<div class="stats">'+st.map(x=>'<div class="stat s-'+x[0]+'"><i></i><b>'+cnt[x[0]]+'</b>'+x[1]+'</div>').join('')+'</div>';

  // cały zespół
  const n=norm(state.name);
  let team='';
  for(let d=1;d<=daysIn;d++){
    const dt=new Date(y,m,d), k=key(dt), r=state.rows[k];
    if(!r&&!covered(k)) continue;
    const we=isWeekend(dt);
    const hol=holidayName(k), hw=hol&&!we;
    const lab=we?['Weekend','Weekend II','Trzeci','Dyżur']:['Popołudnie','Popołudnie II','Trzeci','Dyżur'];
    const parts=[];
    if(r&&hw){
      const all=r.filter(Boolean);
      if(all.length) parts.push('Rano w święto: '+all.map(x=>nameHtml(x,n,'rano')).join(', '));
    } else if(r){
      const p1=[r[0],r[1]].filter(Boolean);
      if(p1.length) parts.push(lab[0]+': '+p1.map(x=>nameHtml(x,n,we?'weekend':'popo')).join(', '));
      if(r[2]) parts.push('Trzeci: '+nameHtml(r[2],n,'trzeci'));
      if(r[3]) parts.push('Dyżur: '+nameHtml(r[3],n,'dyzur'));
    }
    const body=parts.length?parts.join('<br>'):'<span class="empty">'+(hol?esc(hol)+', wolne':we?'wolne':'nikt nie wpisany, tylko zmiana poranna')+'</span>';
    team+='<button type="button" class="team-row'+(we?' we':'')+(k===tk?' is-today':'')+'" data-day="'+k+'"><span class="team-date">'+d+'<small>'+WD_SHORT[dt.getDay()]+'</small></span><span class="team-names">'+body+(parts.length&&hol?'<br><span class="empty">'+esc(hol)+'</span>':'')+'</span></button>';
  }
  h+='<h3 class="sec">Cały zespół w '+MONTHS_LOC[m]+'</h3>';
  h+=team?'<div class="team">'+team+'</div>':'<div class="card hint" style="margin:0">Brak grafiku na ten miesiąc. Wklej go w zakładce „Wklej”.</div>';
  h+='<p class="hint edit-only">Dotknij dnia, żeby wpisać zamianę albo zmienić swoją zmianę.</p>';
  el.innerHTML=h;
  el.querySelector('#mPrev').addEventListener('click',()=>{viewMonth=m===0?{y:y-1,m:11}:{y,m:m-1};renderGrafik();});
  el.querySelector('#mNext').addEventListener('click',()=>{viewMonth=m===11?{y:y+1,m:0}:{y,m:m+1};renderGrafik();});
}
function nameHtml(cell,n,s){
  return esc(cell).split(/(\s*[\/,;+&]\s*)/).map(p=>norm(p)===n&&n?'<mark class="s-'+s+'">'+p+'</mark>':'<b>'+p+'</b>').join('');
}

/* ---------- edycja dnia ---------- */
function openDayRO(k){

  h+='<div class="grid2">'+lab.map((l,i)=>'<div><label class="f" for="dC'+i+'" style="margin:0 0 4px;font-weight:500">'+l+'</label><input class="inp" id="dC'+i+'" list="nameList" autocomplete="off" value="'+esc(r[i])+'"></div>').join('')+'</div>';
  h+='<p class="hint">'+(hol&&!we?'To święto: kto jest tu wpisany, ma zmianę poranną, reszta ma wolne. ':'')+'Zamieniasz się z kimś? Wpisz swoje imię w miejsce kolegi, a aplikacja sama przeliczy zmiany i wolne po weekendzie.</p>';
  h+='<div class="btn-row"><button type="button" class="btn ghost" id="dCancel">Anuluj</button><button type="button" class="btn" id="dSave">Zapisz</button></div>';

    if(state.rows[k]||vals.some(Boolean)) state.rows[k]=vals;

function confirmBox(title,text,okLabel,danger){
  return new Promise(res=>{
    const sh=$('#sheet');
    sh.innerHTML='<div class="grip"></div><h2>'+esc(title)+'</h2>'+(text?'<p class="hint" style="font-size:15px">'+esc(text)+'</p>':'')+
      '<div class="btn-row"><button type="button" class="btn ghost" id="cNo">Anuluj</button><button type="button" class="btn'+(danger?' danger-fill':'')+'" id="cYes">'+esc(okLabel||'Tak')+'</button></div>';
    $('#sheetWrap').hidden=false;
    let done=false; const fin=v=>{ if(done) return; done=true; closeSheet(); res(v); };
    sh.querySelector('#cNo').addEventListener('click',()=>fin(false));
    sh.querySelector('#cYes').addEventListener('click',()=>fin(true));
  });
}
function closeSheet(){ $('#sheetWrap').hidden=true; $('#sheet').innerHTML=''; }

/* ---------- URLOP ---------- */
let vacYear=todayDate().getFullYear();
function renderUrlop(){
  const el=$('#tab-urlop'), tk=key(todayDate()), y=vacYear;
  const yA=y+'-01-01', yB=y+'-12-31';
  const vs=state.vacations.filter(v=>v.to>=yA&&v.from<=yB).sort((a,b)=>a.from.localeCompare(b.from));
  const up=vs.filter(v=>v.to>=tk), past=vs.filter(v=>v.to<tk).reverse();
  const used=usedInYear(y), pool=state.allowance[y];
  let h='<div class="cal-head"><h2>Urlop <span>'+y+'</span></h2><div class="cal-nav">'+
    '<button type="button" class="icon-btn" id="yPrev" aria-label="Poprzedni rok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>'+
    '<button type="button" class="icon-btn" id="yNext" aria-label="Następny rok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div></div>';
  h+='<div class="card">';
  if(pool!=null){
    const left=pool-used, pct=pool>0?Math.min(100,Math.round(used/pool*100)):100;
    h+='<div class="pool-num">'+(left<0?0:left)+'</div><div class="pool-txt">'+(left<0?'Przekroczono pulę o '+plDni(-left):(left===1?'dzień':'dni')+' urlopu zostało z '+pool)+'</div>'+
       '<div class="meter'+(left<0?' over':'')+'"><i style="width:'+pct+'%"></i></div>'+
       '<p class="hint">Wykorzystane i zaplanowane w '+y+': '+plDni(used)+'.</p>';
  } else {
    h+='<div class="pool-txt">Ustaw, ile dni urlopu masz w '+y+'</div><p class="hint" style="margin-top:4px">Aplikacja będzie sama odejmować każdy dodany urlop. Wykorzystane i zaplanowane: '+plDni(used)+'.</p>';
  }
  h+='<div class="edit-only"><label class="f" for="vPool" style="margin-top:16px">Pula dni na '+y+' (razem z zaległym)</label><div class="pool-row"><input class="inp" type="number" inputmode="numeric" min="0" max="999" id="vPool" value="'+(pool!=null?pool:'')+'" placeholder="np. 26"><button type="button" class="btn" id="vPoolSave">Zapisz</button></div></div></div>';
  const defFrom=y===todayDate().getFullYear()?tk:yA;
  h+='<h3 class="sec edit-only">Dodaj urlop</h3><div class="card edit-only"><div class="grid2"><div><label class="f" for="vFrom">Od</label><input class="inp" type="date" id="vFrom" value="'+defFrom+'"></div><div><label class="f" for="vTo">Do</label><input class="inp" type="date" id="vTo" value="'+defFrom+'"></div></div>'+
     '<label class="f" for="vNote">Notatka (opcjonalnie)</label><input class="inp" id="vNote" autocomplete="off" placeholder="np. narty">'+
     '<p class="hint" id="vInfo"></p><div class="btn-row"><button type="button" class="btn" id="vAdd">Dodaj urlop</button></div></div>';
  h+='<p class="hint edit-only">Z puli liczą się tylko dni, w które normalnie byś pracował. Weekendy, święta i wolne za weekend nie zabierają urlopu.</p>';
  h+='<h3 class="sec">Zaplanowane</h3>'+(up.length?'<div class="list">'+up.map(v=>vacHtml(v,false)).join('')+'</div>':'<div class="card hint" style="margin:0">Nic jeszcze nie zaplanowano.</div>');
  if(past.length) h+='<h3 class="sec">Minione</h3><div class="list">'+past.map(v=>vacHtml(v,true)).join('')+'</div>';
  el.innerHTML=h;
  el.querySelector('#yPrev').addEventListener('click',()=>{vacYear--;renderUrlop();});
  el.querySelector('#yNext').addEventListener('click',()=>{vacYear++;renderUrlop();});
  el.querySelector('#vPoolSave').addEventListener('click',()=>{
    const raw=el.querySelector('#vPool').value.trim();
    if(raw===''){ delete state.allowance[y]; commit(); renderAll(); toast('Usunięto pulę'); return; }
    const v=Math.round(+raw); if(!(v>=0&&v<1000)){toast('Wpisz liczbę dni');return;}
    state.allowance[y]=v; commit(); renderAll(); toast('Zapisano pulę: '+plDni(v));
  });
  const f=el.querySelector('#vFrom'), t=el.querySelector('#vTo'), info=el.querySelector('#vInfo');
  const upd=()=>{
    if(t.value<f.value) t.value=f.value;
    if(!f.value||!t.value){info.textContent='';return;}
    const c=newVacCost(f.value,t.value), fy=+f.value.slice(0,4), p=state.allowance[fy];
    info.textContent='Zabierze '+plDni(c)+' z puli'+(p!=null&&f.value.slice(0,4)===t.value.slice(0,4)?', zostanie '+plDni(p-usedInYear(fy)-c)+' w '+fy:'')+'.';
  };
  f.addEventListener('change',upd); t.addEventListener('change',upd); upd();
  el.querySelector('#vAdd').addEventListener('click',()=>{
    if(!f.value||!t.value){toast('Wybierz daty');return;}
    const c=newVacCost(f.value,t.value);
    state.vacations.push({id:Math.random().toString(36).slice(2),from:f.value,to:t.value<f.value?f.value:t.value,note:el.querySelector('#vNote').value.trim()});
    commit(); renderAll(); toast('Dodano urlop, z puli '+plDni(c));
  });
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    const v=state.vacations.find(x=>x.id===b.dataset.del); if(!v) return;
    if(!await confirmBox('Usunąć urlop '+fmtRange(v.from,v.to)+'?','Dni wrócą do puli urlopu.','Usuń',true)) return;
    state.vacations=state.vacations.filter(v=>v.id!==b.dataset.del); commit(); renderAll(); toast('Usunięto urlop, dni wróciły do puli');
  }));
}

function renderImport(){
  const el=$('#tab-import');
  let h='<div class="cal-head"><h2>Wklej grafik</h2></div>';
  h+='<div class="card"><label class="f" for="iText">Skopiuj tabelkę z Excela albo maila i wklej ją tutaj</label>'+
     '<textarea class="inp" id="iText" spellcheck="false" placeholder="Data&#9;Popołudnie/Weekend&#9;Popołudnie II/Weekend II&#9;Trzeci człowiek&#9;Dyżur telefoniczny&#10;1-sty-2027 pt.&#10;2-sty-2027 sob.&#9;Tomek&#9;&#9;&#9;Maksym">'+esc(importText)+'</textarea>'+
     '<div class="preview" id="iPrev"></div>'+
     '<label class="check" id="iOverWrap" hidden><input type="checkbox" id="iOver"><span id="iOverTxt"></span></label>'+
     '<label class="check"><input type="checkbox" id="iKeep" checked><span>Zachowaj moje ręczne zmiany w tych dniach</span></label>'+
     '<div class="btn-row"><button type="button" class="btn ghost" id="iClear">Wyczyść</button><button type="button" class="btn" id="iGo" disabled>Wczytaj do grafiku</button></div></div>';

  h+='<p class="hint">Nowe dni są dopisywane do tych, które już masz. Dni, które już są w grafiku, zmienią się tylko wtedy, gdy to zaznaczysz. Nagłówki i wiersze typu „GRUDZIEŃ” są pomijane.</p>';
  el.innerHTML=h;
  const ta=el.querySelector('#iText'), prev=el.querySelector('#iPrev'), go=el.querySelector('#iGo');
  const ow=el.querySelector('#iOverWrap'), owTxt=el.querySelector('#iOverTxt');
  const sameRow=(a,b)=>a&&b&&a.join('\t')===b.join('\t');
  const overlap=p=>Object.keys(p.rows).filter(k=>state.rows[k]&&!sameRow(state.rows[k],p.rows[k])).sort();
  const monthsOf=ks=>{ const byY={}; [...new Set(ks.map(k=>k.slice(0,7)))].forEach(m=>{ const y=m.slice(0,4); (byY[y]=byY[y]||[]).push(MONTHS_NOM[+m.slice(5)-1].toLowerCase()); }); return Object.keys(byY).map(y=>byY[y].join(', ')+' '+y).join('; '); };
  const upd=()=>{
    importText=ta.value;
    ow.hidden=true;
    if(!ta.value.trim()){prev.innerHTML='';go.disabled=true;return;}
    const p=parseSchedule(ta.value);
    if(!p.count){prev.innerHTML='<span class="bad">Nie rozpoznano żadnej daty. Sprawdź, czy każdy wiersz zaczyna się od daty, np. 2-lis-2026.</span>';go.disabled=true;return;}
    const c={popo:0,weekend:0,dyzur:0,trzeci:0,rano:0};
    Object.keys(p.rows).forEach(k=>{const a=assignmentFor(p.rows[k],k,state.name); if(a) c[a]++;});
    let s='Rozpoznano <b>'+p.count+'</b> '+(p.count===1?'dzień':'dni')+': '+esc(fmtDay(p.from,false))+' – '+esc(fmtDay(p.to,false))+'.';
    if(state.name) s+='<br>'+esc(state.name)+': popołudniówki '+c.popo+', dni weekendowe '+c.weekend+', dyżur '+c.dyzur+(c.trzeci?', trzeci człowiek '+c.trzeci:'')+(c.rano?', rano w święto '+c.rano:'')+'.';
    if(p.bad) s+='<br><span class="bad">Pominięto wierszy z nierozpoznaną datą: '+p.bad+'.</span>';
    const ov=overlap(p), fresh=Object.keys(p.rows).filter(k=>!state.rows[k]).length;
    s+='<br>Nowe dni do dopisania: <b>'+fresh+'</b>.';
    if(ov.length){ ow.hidden=false; owTxt.textContent='Zastąp też '+plDni(ov.length)+', które już mam inaczej wpisane ('+monthsOf(ov)+')'; }
    prev.innerHTML=s; prev.className='preview ok'; go.disabled=false;
  };
  ta.addEventListener('input',upd); upd();
  el.querySelector('#iClear').addEventListener('click',()=>{ta.value='';upd();ta.focus();});
  go.addEventListener('click',()=>{
    const p=parseSchedule(ta.value); if(!p.count) return;
    const keep=el.querySelector('#iKeep').checked;
    snapshot('wklejenia grafiku');
    const over=el.querySelector('#iOver').checked;
    let added=0, replaced=0, skipped=0;
    Object.keys(p.rows).forEach(k=>{
      const had=state.rows[k];
      if(had&&!sameRow(had,p.rows[k])&&!over){ skipped++; return; }
      if(!had) added++; else if(!sameRow(had,p.rows[k])) replaced++;
      state.rows[k]=p.rows[k]; if(!keep) delete state.overrides[k];
    });
    commit(); importText='';
    toast('Dopisano '+plDni(added)+(replaced?', zastąpiono '+replaced:'')+(skipped?', pominięto '+skipped+' istniejących':''));
    renderAll();
    viewMonth={y:fromKey(p.from).getFullYear(),m:fromKey(p.from).getMonth()};
  });
}

/* ---------- CSV ---------- */
function csvCell(v){ v=String(v==null?'':v); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(bom){
  const L=[['typ','data','pole1','pole2','pole3','pole4']];
  L.push(['ustawienia','imie',state.name,'','','']);
  L.push(['ustawienia','motyw',state.theme,'','','']);
  Object.keys(state.allowance).sort().forEach(y=>L.push(['pula',y,String(state.allowance[y]),'','','']));
  Object.keys(state.rows).sort().forEach(k=>L.push(['grafik',k].concat(state.rows[k])));
  Object.keys(state.overrides).sort().forEach(k=>L.push(['zmiana',k,state.overrides[k],'','','']));
  state.vacations.slice().sort((a,b)=>a.from.localeCompare(b.from)).forEach(v=>L.push(['urlop',v.from,v.to,v.note,'','']));
  return (bom?'\ufeff':'')+L.map(r=>r.map(csvCell).join(';')).join('\r\n')+'\r\n';
}
function parseCSV(text){
  text=String(text||'').replace(/^\ufeff/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const sep=first.indexOf(';')>=0?';':first.indexOf('\t')>=0?'\t':',';
  const out=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); out.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell||row.length){ row.push(cell); out.push(row); }
  return out;
}
function importCSV(text){
  const ISO=/^\d{4}-\d{2}-\d{2}$/;
  const n={grafik:0,zmiana:0,urlop:0}; let ok=false;
  parseCSV(text).forEach(r=>{
    const t=(r[0]||'').trim().toLowerCase(), d=(r[1]||'').trim(), v2=(r[2]||'').trim();
    if(t==='pula'&&/^\d{4}$/.test(d)&&v2!==''&&+v2>=0){ state.allowance[d]=Math.round(+v2); ok=true; return; }
    if(t==='ustawienia'){
      ok=true;
      if(d==='imie'&&v2&&!state.name) state.name=v2;
      if(d==='motyw'&&['auto','light','dark'].includes(v2)) state.theme=v2;
      return;
    }
    if(!ISO.test(d)) return;
    if(t==='grafik'){ state.rows[d]=[2,3,4,5].map(i=>(r[i]||'').trim()); n.grafik++; ok=true; }
    else if(t==='zmiana'&&OVERRIDES.includes(v2)){ state.overrides[d]=v2; n.zmiana++; ok=true; }
    else if(t==='urlop'&&ISO.test(v2)){
      const to=v2<d?d:v2;
      if(!state.vacations.some(v=>v.from===d&&v.to===to)) state.vacations.push({id:Math.random().toString(36).slice(2),from:d,to,note:(r[3]||'').trim()});
      n.urlop++; ok=true;
    }
  });
  return ok?n:null;
}
function arm(btn,fn,text){
  btn.addEventListener('click',async()=>{
    const label=btn.textContent.trim();
    if(await confirmBox(label+'?',text||'Tej operacji nie da się łatwo cofnąć.',label,true)) fn();
  });
}

/* ---------- synchronizacja przez GitHub Gist ---------- */
const GH_API='https://api.github.com';
const GH_FILE='grafik.json';
const GH_DESC='Grafik – synchronizacja aplikacji (nie usuwaj)';
const SYNC_KEY='grafik.gh';
let sync=(()=>{ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||'null')||{}; }catch(e){ return {}; } })();
function saveSync(){ try{ localStorage.setItem(SYNC_KEY,JSON.stringify(sync)); }catch(e){} }
let syncStatus={busy:false,msg:'',err:false};

// linki: #podglad=<id gista> (żona), #polacz=<token> (twoje urządzenia)
(function readLink(){
  const h=location.hash.replace(/^#/,'');
  if(!h) return;
  const m=h.match(/^(podglad|polacz)=([A-Za-z0-9_]+)$/);
  if(!m) return;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(m[1]==='podglad'){
    if(sync.mode==='edit') return;
    if(sync.mode!=='view'||sync.gistId!==m[2]) sync={mode:'view',gistId:m[2],seen:0};
  } else {
    sync={mode:'edit',token:m[2],gistId:sync.mode==='edit'?sync.gistId:'',seen:0};
  }
  saveSync();
})();
if(sync.mode==='view'){ READONLY=true; LS_KEY='grafik.view.v1'; document.body.classList.add('ro'); }

async function gh(path,opt,token){
  opt=opt||{};
  const h={'Accept':'application/vnd.github+json'};
  if(token) h['Authorization']='Bearer '+token;
  if(opt.body) h['Content-Type']='application/json';
  const r=await fetch(GH_API+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
  if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status; throw e; }
  return r.status===204?null:r.json();
}
function ghError(e){
  if(!navigator.onLine||!e.status) return 'Brak połączenia z internetem. Zsynchronizuję, gdy wróci.';
  if(e.status===401) return 'Token jest nieprawidłowy albo wygasł. Wklej nowy.';
  if(e.status===403||e.status===429) return 'GitHub chwilowo ogranicza odświeżanie. Spróbuj za kilka minut.';
  if(e.status===404) return sync.mode==='view'?'Nie znaleziono grafiku. Poproś o nowy link.':'Nie znaleziono pliku synchronizacji na GitHubie.';
  return 'Błąd synchronizacji ('+e.status+').';
}
async function readGist(id,token){
  const g=await gh('/gists/'+id,null,token);
  const f=g.files&&g.files[GH_FILE];
  if(!f) return null;
  let txt=f.content;
  if(f.truncated&&f.raw_url){ const r=await fetch(f.raw_url,{cache:'no-store'}); txt=await r.text(); }
  let d=null; try{ d=JSON.parse(txt); }catch(e){}
  if(!d||!d.state) return null;
  const s=sanitize(d.state); if(!s) return null;
  s.updatedAt=+d.updatedAt||s.updatedAt;
  return s;
}
const gistBody=s=>({description:GH_DESC,files:{[GH_FILE]:{content:JSON.stringify({app:'grafik',v:1,updatedAt:s.updatedAt,state:s},null,1)}}});
async function findOrCreateGist(token){
  for(let page=1;page<=5;page++){
    const list=await gh('/gists?per_page=100&page='+page,null,token);
    const hit=list.find(g=>g.files&&g.files[GH_FILE]&&g.description===GH_DESC);
    if(hit) return {id:hit.id,created:false};
    if(list.length<100) break;
  }
  const g=await gh('/gists',{method:'POST',body:Object.assign({public:false},gistBody(state))},token);
  return {id:g.id,created:true};
}
function adoptRemote(r){
  const th=state.theme;
  state=r; state.theme=th;
  recomputeRange(); saveLocal(); applyTheme(); renderAll();
}

let syncAgain=false, lastPull=0;
async function runSync(reason){
  if(!sync.mode) return;
  if(syncStatus.busy){ syncAgain=true; return; }
  syncStatus.busy=true; refreshSyncCard();
  try{
    if(sync.mode==='view'){
      const r=await readGist(sync.gistId,null);
      if(!r) throw Object.assign(new Error('brak'),{status:404});
      if(r.updatedAt!==sync.seen||!state.name){ adoptRemote(r); }
      sync.seen=r.updatedAt;
    } else {
      if(!sync.gistId){
        const f=await findOrCreateGist(sync.token);
        sync.gistId=f.id; saveSync();
        if(f.created){ sync.seen=state.updatedAt; }
      }
      const r=await readGist(sync.gistId,sync.token);
      const localDirty=state.updatedAt!==sync.seen;
      const remoteChanged=r&&r.updatedAt!==sync.seen;
      if(!r){
        await gh('/gists/'+sync.gistId,{method:'PATCH',body:gistBody(state)},sync.token);
        sync.seen=state.updatedAt;
      } else if(remoteChanged&&!localDirty){
        adoptRemote(r); sync.seen=r.updatedAt;
      } else if(localDirty&&!remoteChanged){
        await gh('/gists/'+sync.gistId,{method:'PATCH',body:gistBody(state)},sync.token);
        sync.seen=state.updatedAt;
      } else if(localDirty&&remoteChanged){
        let m;
        if(!state.updatedAt) m=r;   // świeże urządzenie bez własnych danych
        else m=r.updatedAt>state.updatedAt?mergeStates(r,state):mergeStates(state,r);
        m.updatedAt=Date.now();
        adoptRemote(m);
        await gh('/gists/'+sync.gistId,{method:'PATCH',body:gistBody(state)},sync.token);
        sync.seen=state.updatedAt;
      }
    }
    sync.lastOk=Date.now(); syncStatus.msg=''; syncStatus.err=false;
  }catch(e){
    syncStatus.msg=ghError(e); syncStatus.err=true;
  }
  lastPull=Date.now(); saveSync();
  syncStatus.busy=false; refreshSyncCard();
  if(syncAgain){ syncAgain=false; runSync('again'); }
}
let pushTimerGh=null;
window.__onCommit=()=>{ if(sync.mode!=='edit') return; clearTimeout(pushTimerGh); pushTimerGh=setTimeout(()=>runSync('commit'),1200); };
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&sync.mode&&Date.now()-lastPull>20000) runSync('focus'); });
window.addEventListener('online',()=>{ if(sync.mode) runSync('online'); });
setInterval(()=>{ if(!document.hidden&&sync.mode==='edit'&&Date.now()-lastPull>180000) runSync('timer'); },30000);

function fmtWhen(ts){ return ts?new Date(ts).toLocaleString('pl-PL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'jeszcze nie'; }
function refreshSyncCard(){ if(currentTab==='ust'){ const el=document.querySelector('#syncCard'); if(el){ el.outerHTML=window.__syncCard(); window.__bindSync(document.querySelector('#tab-ust')); } } }
function linkFor(hash){ return location.origin+location.pathname+'#'+hash; }
async function shareOrCopy(url,label){
  try{ if(navigator.share){ await navigator.share({title:'Grafik',url}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(url); toast(label+' skopiowany'); }
  catch(e){ const i=document.querySelector('#syncLinkOut'); if(i){ i.hidden=false; i.value=url; i.focus(); i.select(); } toast('Zaznaczono link, skopiuj go ręcznie'); }
}

window.__syncCard=function(){
  const st=syncStatus.busy?'Synchronizuję…':syncStatus.err?esc(syncStatus.msg):'Ostatnia synchronizacja: '+fmtWhen(sync.lastOk);
  let h='<div id="syncCard"><h3 class="sec">Synchronizacja</h3><div class="card">';
  if(sync.mode==='view'){
    h+='<div class="row-title">Podgląd grafiku</div><div class="row-main">'+esc(state.name||'…')+'</div>'+
       '<p class="hint">Grafik odświeża się sam przy każdym otwarciu aplikacji. Nie da się go tu zmienić.</p><p class="hint" style="margin-top:4px">'+st+'</p>'+
       '<div class="btn-row"><button type="button" class="btn" id="ghNow">Odśwież teraz</button></div>'+
       '<div class="btn-row"><button type="button" class="btn danger" id="ghOff">Odłącz podgląd</button></div>';
  } else if(sync.mode==='edit'){
    const tk=sync.token||'';
    h+='<div class="row-title">Połączono z GitHubem</div><div class="row-main" style="font-size:16px">Token ••••'+esc(tk.slice(-4))+'</div>'+
       '<p class="hint">'+st+'</p>'+
       '<div class="btn-row"><button type="button" class="btn" id="ghNow">Synchronizuj teraz</button></div>'+
       '<label class="f" style="margin-top:20px">Link do podglądu</label><p class="hint" style="margin-top:0">Kto otworzy ten link, zobaczy twój grafik, ale nic w nim nie zmieni.</p>'+
       '<div class="btn-row"><button type="button" class="btn ghost" id="ghView"'+(sync.gistId?'':' disabled')+'>Wyślij link podglądu</button></div>'+
       '<label class="f" style="margin-top:20px">Twoje inne urządzenia</label><p class="hint" style="margin-top:0">Link, który od razu łączy drugie urządzenie z edycją. Zawiera twój token, więc wysyłaj go tylko sobie.</p>'+
       '<div class="btn-row"><button type="button" class="btn ghost" id="ghEdit">Wyślij link do mojego urządzenia</button></div>'+
       '<input class="inp" id="syncLinkOut" readonly hidden style="margin-top:10px">'+
       '<div class="btn-row"><button type="button" class="btn danger" id="ghOff">Rozłącz to urządzenie</button></div>';
  } else {
    h+='<p class="hint" style="margin-top:0">Połącz aplikację z GitHubem, żeby grafik sam synchronizował się między twoimi urządzeniami.</p>'+
       '<label class="f" for="ghToken">Token z GitHuba</label><input class="inp" id="ghToken" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…">'+
       (syncStatus.err?'<p class="hint">'+esc(syncStatus.msg)+'</p>':'')+
       '<div class="btn-row"><button type="button" class="btn" id="ghConnect">Połącz</button></div>'+
       '<details class="hint" style="margin-top:12px"><summary>Skąd wziąć token?</summary><ol style="padding-left:20px;margin:8px 0 0">'+
       '<li>Zaloguj się na github.com.</li><li>Kliknij swoje zdjęcie → <b>Settings</b> → na dole <b>Developer settings</b>.</li>'+
       '<li><b>Personal access tokens → Tokens (classic) → Generate new token (classic)</b>.</li>'+
       '<li>Nazwa np. „Grafik”, ważność <b>No expiration</b>, zaznacz tylko <b>gist</b>.</li>'+
       '<li>Kliknij <b>Generate token</b>, skopiuj go i wklej tutaj.</li></ol></details>';
  }
  return h+'</div></div>';
};
window.__bindSync=function(el){
  const q=s=>el.querySelector(s);
  const c=q('#ghConnect');
  if(c) c.addEventListener('click',()=>{
    const v=(q('#ghToken').value||'').trim();
    if(!/^[A-Za-z0-9_]{20,}$/.test(v)){ toast('To nie wygląda na token z GitHuba'); return; }
    c.disabled=true; c.textContent='Sprawdzam token…';
    gh('/gists?per_page=1',null,v).then(()=>{
      sync={mode:'edit',token:v,gistId:'',seen:0}; saveSync(); syncStatus={busy:false,msg:'',err:false};
      refreshSyncCard();
      return runSync('connect').then(()=>{ if(!syncStatus.err) toast('Połączono z GitHubem'); });
    }).catch(err=>{
      syncStatus={busy:false,msg:ghError(err),err:true}; refreshSyncCard();
    });
  });
  const n=q('#ghNow'); if(n) n.addEventListener('click',()=>runSync('manual'));
  const v=q('#ghView'); if(v) v.addEventListener('click',()=>shareOrCopy(linkFor('podglad='+sync.gistId),'Link podglądu'));
  const e=q('#ghEdit'); if(e) e.addEventListener('click',()=>shareOrCopy(linkFor('polacz='+sync.token),'Link'));
  const o=q('#ghOff'); if(o) arm(o,()=>{
    const wasView=sync.mode==='view';
    sync={}; saveSync(); syncStatus={busy:false,msg:'',err:false};
    if(wasView){ try{ localStorage.removeItem('grafik.view.v1'); }catch(x){} location.reload(); return; }
    toast('Rozłączono. Dane zostają na tym urządzeniu.'); renderAll();
  },sync.mode==='view'?'Grafik zniknie z tego telefonu. Żeby go znów zobaczyć, potrzebny będzie nowy link.':'Dane zostaną na tym urządzeniu, ale przestaną się synchronizować.');
};
if(sync.mode) setTimeout(()=>runSync('start'),0);

const loaded=loadLocal();
if(loaded) state=loaded;
else { state=emptyState(); state.rows=parseSchedule(SEED).rows; }
recomputeRange(); applyTheme();

document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
$('#whoBtn').addEventListener('click',()=>showTab('ust'));
document.addEventListener('click',e=>{
  const day=e.target.closest('[data-day]'); if(day&&state.name){ openDay(day.dataset.day); return; }
  const go=e.target.closest('[data-go]'); if(go) showTab(go.dataset.go);
});
$('#sheetWrap').addEventListener('click',e=>{ if(e.target.id==='sheetWrap') closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#sheetWrap').hidden) closeSheet(); });
let lastDay=key(todayDate());
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&key(todayDate())!==lastDay){ lastDay=key(todayDate()); renderAll(); } });

applyLock();
renderAll();
initRemote();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
